plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.rhinelore.app'
    compileSdk 34

    signingConfigs {
        release {
            def storeFileEnv = System.getenv("RHINE_STORE_FILE")
            if (storeFileEnv) {
                storeFile file(storeFileEnv)
                storePassword System.getenv("RHINE_STORE_PASSWORD") ?: "RhineLore@2026-Release"
                keyAlias System.getenv("RHINE_KEY_ALIAS") ?: "rhine-lore"
                keyPassword System.getenv("RHINE_KEY_PASSWORD") ?: "RhineLore@2026-Release"
            }
        }
    }

    defaultConfig {
        applicationId "com.rhinelore.app"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "0.2.0"
        ndk {
            // arm64-v8a 覆盖绝大多数真机；x86_64 便于模拟器调试
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    sourceSets {
        main {
            python.srcDirs = ["src/main/python", "../../src"]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("RHINE_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
        buildPython "C:/Users/BaiOS/AppData/Local/Programs/Python/Python311/python.exe"
    }
}

tasks.register('copyWebAssets', Copy) {
    from "../../ui/dist"
    into "src/main/assets/ui"
    include "**/*"
}

tasks.named('preBuild') {
    dependsOn 'copyWebAssets'
}
