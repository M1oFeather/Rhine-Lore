plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.rhinelore.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.rhinelore.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
        ndk {
            // arm64-v8a 覆盖绝大多数真机；x86_64 便于模拟器调试
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    sourceSets {
        main {
            python.srcDirs = ["src/main/python", "../../src"]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
        buildPython "C:/Users/BaiOS/AppData/Local/Programs/Python/Python311/python.exe"
    }
}

tasks.register('copyWebAssets', Copy) {
    from "../../ui/dist"
    into "src/main/assets/ui"
    include "**/*"
}

tasks.named('preBuild') {
    dependsOn 'copyWebAssets'
}
