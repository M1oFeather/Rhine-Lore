plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.rhinelore.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.rhinelore.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    sourceSets {
        main {
            python.srcDirs = ["src/main/python", "../../src"]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultPythonVersion "3.11"
}

tasks.register('copyWebAssets', Copy) {
    from "../../ui/dist"
    into "src/main/assets/ui"
    include "**/*"
}

tasks.named('preBuild') {
    dependsOn 'copyWebAssets'
}
