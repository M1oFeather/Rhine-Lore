[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rhine-lore"
version = "0.1.0"
description = "Creative writing studio powered by audited Rhine-Vault knowledge."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rhine-lore = "rhine_lore.core:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rhine_lore"]
artifacts = ["web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

